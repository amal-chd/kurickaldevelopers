name: Mobile CI

# Analyzes and tests the Flutter app on every push/PR. Release builds (AAB/IPA)
# stay manual/signed for now; add a build job with signing secrets when ready.
on:
  push:
    branches: [main, mobile]
  pull_request:
    branches: [main, mobile]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Flutter · analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib
        continue-on-error: true

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test
