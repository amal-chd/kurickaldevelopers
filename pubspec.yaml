name: task_pilot
description: "Task Pilot - Construction Task Management System for Kurickal Developers LLP"
publish_to: 'none'
version: 1.0.21+28

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0

  # Storage (file uploads only — chat files + documents). Auth/DB stay on Firebase.
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Auth
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.0.0

  # UI & Charts
  fl_chart: ^0.68.0
  flutter_pdfview: ^1.3.0
  photo_view: ^0.15.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  google_fonts: ^6.2.0

  # Device features
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  geolocator: ^11.0.0
  open_file: ^3.3.0
  connectivity_plus: ^6.0.0

  # Document Viewer dependencies
  video_player: ^2.8.2
  audioplayers: ^6.0.0
  share_plus: ^9.0.0
  printing: ^5.11.0
  archive: ^3.6.1

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  csv: ^6.0.0
  http: ^1.2.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0d2b5c"
  adaptive_icon_foreground: "assets/images/logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - google_fonts/
